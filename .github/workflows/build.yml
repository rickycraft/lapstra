name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: go build -trimpath -o lapstra .
      - uses: actions/upload-artifact@v7
        with:
          name: lapstra-linux-amd64
          path: lapstra
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lapstra-linux-amd64
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv lapstra lapstra-linux-amd64
          gh release create "$GITHUB_REF_NAME" lapstra-linux-amd64 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
